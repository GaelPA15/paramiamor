<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nuestro Hogar 🏡</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Caveat:wght@400;600&display=swap');
 
  * { margin: 0; padding: 0; box-sizing: border-box; }
 
  body {
    background: #fdf6e3;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: 'Caveat', cursive;
    background-image:
      radial-gradient(circle at 20% 30%, rgba(210,200,180,0.15) 0%, transparent 60%),
      repeating-linear-gradient(0deg, transparent, transparent 28px, rgba(180,170,150,0.08) 28px, rgba(180,170,150,0.08) 29px),
      repeating-linear-gradient(90deg, transparent, transparent 28px, rgba(180,170,150,0.05) 28px, rgba(180,170,150,0.05) 29px);
  }
 
  h1 {
    font-size: 2rem;
    color: #5a4a3a;
    margin-bottom: 18px;
    letter-spacing: 1px;
    opacity: 0;
    animation: fadeTitle 1s ease 0.2s forwards;
  }
 
  @keyframes fadeTitle {
    to { opacity: 1; }
  }
 
  .paper {
    background: #fffdf5;
    border-radius: 4px;
    box-shadow:
      0 2px 6px rgba(0,0,0,0.10),
      0 8px 30px rgba(0,0,0,0.08),
      inset 0 0 60px rgba(210,200,170,0.18);
    padding: 24px 28px 16px;
    position: relative;
    border: 1px solid rgba(180,160,130,0.3);
  }
 
  .paper::before {
    content: '';
    position: absolute;
    left: 48px;
    top: 0; bottom: 0;
    width: 1.5px;
    background: rgba(200,170,200,0.25);
    border-radius: 2px;
  }
 
  svg {
    display: block;
    filter: drop-shadow(1px 2px 3px rgba(60,40,20,0.08));
  }
 
  /* Pencil stroke style */
  .sketch {
    fill: none;
    stroke: #3a2e22;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
 
  .sketch-fill {
    stroke: #3a2e22;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
 
  /* Animation: draw stroke-dasharray trick */
  [class^="draw-"], [class*=" draw-"] {
    stroke-dasharray: 3000;
    stroke-dashoffset: 3000;
  }
 
  /* Sky & nature fills */
  .sky-fill    { fill: #ddf0fa; stroke: none; }
  .grass-fill  { fill: #b8dfa0; stroke: none; }
  .sun-fill    { fill: #ffe97a; stroke: none; }
  .cloud-fill  { fill: #ffffff; stroke: none; opacity: 0.85; }
  .house-wall  { fill: #fff0f5; }
  .house-roof  { fill: #f48fb1; }
  .door-fill   { fill: #e91e8c; }
  .window-fill { fill: #fce4ec; }
  .flower1     { fill: #ff9eb5; }
  .flower2     { fill: #ffd166; }
  .flower3     { fill: #b5ead7; }
  .leaf-fill   { fill: #7ec85a; }
  .tree-fill   { fill: #6dc45a; }
  .trunk-fill  { fill: #a0714a; }
  .cat-body    { fill: #d4b483; }
  .cat-belly   { fill: #f5e8cc; }
  .skin-fill   { fill: #f5d0a9; }
  .hair1       { fill: #4a2e14; }
  .hair2       { fill: #7a4a1e; }
  .shirt1      { fill: #1a1a1a; }
  .shirt2      { fill: #1a1a1a; }
  .pants1      { fill: #111111; }
  .pants2      { fill: #9a4a6a; }
  .shoe-fill   { fill: #3a2e22; }
  .heart-fill  { fill: #ff6b8a; }
 
  /* Draw animations */
  @keyframes draw {
    to { stroke-dashoffset: 0; }
  }
  @keyframes fadeIn {
    from { opacity: 0; }
    to   { opacity: 1; }
  }
 
  .bg-appear { animation: fadeIn 1.2s ease 0.3s both; }
  .draw-1  { animation: draw 1.8s ease 0.5s both; }
  .draw-2  { animation: draw 2s ease 1.2s both; }
  .draw-3  { animation: draw 1.6s ease 2.0s both; }
  .draw-4  { animation: draw 1.8s ease 2.6s both; }
  .draw-5  { animation: draw 1.4s ease 3.2s both; }
  .draw-6  { animation: draw 1.6s ease 3.8s both; }
  .draw-7  { animation: draw 1.2s ease 4.3s both; }
  .draw-8  { animation: draw 1.4s ease 4.8s both; }
  .draw-9  { animation: draw 1.0s ease 5.3s both; }
  .draw-10 { animation: draw 0.9s ease 5.8s both; }
  .draw-11 { animation: draw 1.0s ease 6.2s both; }
  .draw-12 { animation: draw 0.8s ease 6.6s both; }
  .draw-13 { animation: draw 0.8s ease 7.0s both; }
  .draw-14 { animation: draw 0.7s ease 7.4s both; }
  .draw-15 { animation: draw 0.6s ease 7.8s both; }
 
  .fill-1  { animation: fadeIn 0.6s ease 2.2s both; }
  .fill-2  { animation: fadeIn 0.6s ease 2.8s both; }
  .fill-3  { animation: fadeIn 0.5s ease 3.4s both; }
  .fill-4  { animation: fadeIn 0.5s ease 4.0s both; }
  .fill-5  { animation: fadeIn 0.5s ease 4.6s both; }
  .fill-6  { animation: fadeIn 0.4s ease 5.0s both; }
  .fill-7  { animation: fadeIn 0.4s ease 5.5s both; }
  .fill-8  { animation: fadeIn 0.4s ease 6.0s both; }
  .fill-9  { animation: fadeIn 0.4s ease 6.5s both; }
  .fill-10 { animation: fadeIn 0.4s ease 7.0s both; }
  .fill-11 { animation: fadeIn 0.4s ease 7.5s both; }
  .fill-12 { animation: fadeIn 0.3s ease 7.9s both; }
  .fill-13 { animation: fadeIn 0.3s ease 8.2s both; }
 
  .label {
    font-family: 'Caveat', cursive;
    font-size: 13px;
    fill: #7a5a3a;
    opacity: 0;
    animation: fadeIn 0.8s ease 8.4s both;
  }
 
  .pencil-cursor {
    position: fixed;
    pointer-events: none;
    font-size: 28px;
    transform: translate(-4px, -26px) rotate(-30deg);
    transition: all 0.05s;
    z-index: 999;
    opacity: 0;
    animation: fadeIn 0.5s ease 0.2s both;
  }
</style>
</head>
<body>
 
<div class="pencil-cursor" id="cursor">✏️</div>
 
<h1>✨ Nuestro Lugar Feliz ✨</h1>
 
<div class="paper">
<svg width="720" height="480" viewBox="0 0 720 480" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="pencil" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.4" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="pencil-soft">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" result="noise"/>

    </filter>
    <!-- Sun glow -->
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffe97a" stop-opacity="1"/>
      <stop offset="70%" stop-color="#ffd740" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ffb700" stop-opacity="0"/>

    <!-- Grass gradient -->

      <stop offset="100%" stop-color="#ddf0fa"/>

    cursor.style.opacity = '1';
